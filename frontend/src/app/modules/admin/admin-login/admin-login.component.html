<div class="min-h-screen flex items-center justify-center pt-28 pb-16 px-4 relative overflow-hidden">
  <!-- Glowing Background Orbs -->
  <div class="absolute top-1/3 -left-20 w-96 h-96 rounded-full bg-blue-600/15 blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/3 -right-20 w-96 h-96 rounded-full bg-amber-500/15 blur-3xl pointer-events-none"></div>

  <div class="glass-card max-w-md w-full p-8 border border-white/20 relative shadow-2xl">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="h-20 w-auto bg-white rounded-2xl p-1.5 shadow-xl shadow-amber-500/20 mx-auto mb-4 border border-amber-400/50 inline-flex items-center justify-center">
        <img src="logo.jpg" alt="Jai Sai Travels Logo" class="h-16 w-auto object-contain rounded-xl">
      </div>

      <h1 class="text-2xl font-black text-white tracking-tight">Admin Portal</h1>
      <p class="text-xs text-slate-300 mt-1">Jai Sai Travels Management Dashboard • Since 2005</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="mb-4 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
      <span class="material-icons-round text-sm">error</span>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username or Email</label>
        <div class="relative">
          <span class="material-icons-round absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">person</span>
          <input 
            type="text" 
            [(ngModel)]="credentials.username" 
            name="username" 
            required 
            placeholder="admin" 
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="material-icons-round absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">lock</span>
          <input 
            type="password" 
            [(ngModel)]="credentials.password" 
            name="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="glass-btn glass-btn-primary w-full py-3 text-sm font-bold disabled:opacity-50">
          <span *ngIf="!isLoading()" class="material-icons-round text-base">login</span>
          <span *ngIf="!isLoading()">Sign In to Dashboard</span>
          <span *ngIf="isLoading()">Authenticating...</span>
        </button>
      </div>
    </form>

    <div class="mt-6 pt-6 border-t border-white/10 text-center">
      <a routerLink="/" class="text-xs text-slate-400 hover:text-white inline-flex items-center gap-1">
        <span class="material-icons-round text-xs">arrow_back</span>
        Back to Website
      </a>
    </div>
  </div>
</div>
