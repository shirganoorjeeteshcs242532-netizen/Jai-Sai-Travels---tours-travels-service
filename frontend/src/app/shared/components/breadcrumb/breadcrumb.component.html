<div class="relative pt-32 pb-16 overflow-hidden border-b border-white/10 bg-slate-950/60">
  <!-- Glowing Background Accent -->
  <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl pointer-events-none"></div>

  <div class="container mx-auto px-4 max-w-7xl relative z-10 text-center">
    <!-- Breadcrumb trail -->
    <nav class="flex items-center justify-center gap-2 text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">
      <a routerLink="/" class="hover:text-amber-400 transition-colors flex items-center gap-1">
        <span class="material-icons-round text-sm">home</span>
        Home
      </a>
      <span class="text-slate-600">/</span>
      <ng-container *ngFor="let item of items; let last = last">
        <a *ngIf="!last && item.url" [routerLink]="item.url" class="hover:text-amber-400 transition-colors">
          {{ item.label }}
        </a>
        <span *ngIf="!last && !item.url" class="text-slate-300">{{ item.label }}</span>
        <span *ngIf="!last" class="text-slate-600">/</span>
        <span *ngIf="last" class="text-amber-400 font-bold">{{ item.label }}</span>
      </ng-container>
    </nav>

    <!-- Page Title -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-white tracking-tight">
      {{ pageTitle }}
    </h1>

    <p *ngIf="subtitle" class="text-sm md:text-base text-slate-300 mt-2 max-w-2xl mx-auto font-light">
      {{ subtitle }}
    </p>
  </div>
</div>
